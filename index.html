<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK & TOCFL Pro - Nền Tảng Học Tiếng Trung</title>
    <!-- Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Header Navigation Bar -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30">漢</div>
            <div>
                <span class="font-bold text-lg md:text-xl tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent block leading-none">HSK & TOCFL Pro</span>
                <span class="text-[10px] text-slate-400">Master Chinese Online</span>
            </div>
        </div>
        
        <!-- Controls & Gamification Status -->
        <div class="flex items-center space-x-3 md:space-x-6">
            <!-- TTS Speed Control -->
            <div class="flex items-center space-x-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 text-xs">
                <span class="text-slate-400 hidden sm:inline">Tốc độ:</span>
                <select id="ttsRateSelect" class="bg-transparent text-indigo-300 font-semibold focus:outline-none cursor-pointer" onchange="tts.setRate(parseFloat(this.value))">
                    <option value="0.7" class="bg-slate-800 text-white">0.7x (Chậm)</option>
                    <option value="0.9" selected class="bg-slate-800 text-white">0.9x (Standard)</option>
                    <option value="1.2" class="bg-slate-800 text-white">1.2x (Nhanh)</option>
                </select>
            </div>

            <!-- Stats Badge -->
            <div class="flex items-center space-x-3 text-xs md:text-sm">
                <span class="text-amber-400 font-bold flex items-center gap-1"><span id="streakCount">🔥 1</span> <span class="hidden sm:inline">Streak</span></span>
                <span class="text-emerald-400 font-bold flex items-center gap-1"><span id="xpCount">⚡ 0</span> <span class="hidden sm:inline">XP</span></span>
            </div>

            <!-- Profile / Login -->
            <button onclick="loginGoogle()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition shadow-md shadow-indigo-600/30">
                Đăng nhập
            </button>
        </div>
    </header>

    <!-- Main Content Workspace -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Sidebar: Lộ trình & Bài học -->
        <section class="bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50 backdrop-blur h-fit">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-md font-bold text-indigo-400">Khóa Học</h2>
                <select id="courseSelect" onchange="switchCourse(this.value)" class="bg-slate-800 border border-slate-700 text-xs font-semibold rounded-lg px-2 py-1 text-slate-200">
                    <option value="HSK">HSK (Giản thể)</option>
                    <option value="TOCFL">TOCFL (Phồn thể)</option>
                </select>
            </div>
            
            <div class="space-y-3" id="lessonList">
                <!-- Javascript sẽ render danh sách bài học từ JSON tại đây -->
            </div>
        </section>

        <!-- Content Area: Flashcard & Bài tập -->
        <section class="md:col-span-2 space-y-6">
            
            <!-- 3D Flashcard Section -->
            <div class="bg-slate-800/40 p-6 rounded-2xl border border-slate-700/50 text-center relative">
                <div class="flex justify-between items-center mb-4 text-xs text-slate-400">
                    <span>Flashcard Từ Vựng</span>
                    <button onclick="tts.speak(currentVocab.simplified)" class="px-3 py-1.5 bg-indigo-600/30 text-indigo-300 rounded-lg hover:bg-indigo-600/50 flex items-center gap-1 font-semibold transition">
                        🔊 Phát âm TTS
                    </button>
                </div>

                <!-- Flashcard Display -->
                <div onclick="flipCard()" class="w-full h-56 bg-slate-900/80 rounded-xl border border-slate-700/80 flex flex-col items-center justify-center p-6 cursor-pointer hover:border-indigo-500 transition shadow-inner relative overflow-hidden group">
                    <div id="cardFront" class="text-center transition-all duration-300">
                        <h1 id="cardZh" class="text-5xl font-extrabold text-white mb-2 tracking-wide">你好</h1>
                        <p id="cardPinyin" class="text-xl text-indigo-400 font-medium">nǐ hǎo</p>
                        <p class="text-xs text-slate-500 mt-4">(Bấm để xem nghĩa tiếng Việt)</p>
                    </div>
                    <div id="cardBack" class="hidden text-center transition-all duration-300">
                        <p id="cardMeaning" class="text-2xl font-bold text-emerald-400">Xin chào</p>
                        <p id="cardExample" class="text-sm text-slate-300 mt-3 italic">"你好！很高兴认识你。"</p>
                    </div>
                </div>
                
                <div class="flex justify-between items-center mt-4">
                    <button onclick="prevVocab()" class="text-xs text-slate-400 hover:text-white">← Từ trước</button>
                    <span id="vocabProgress" class="text-xs text-slate-500">1 / 2</span>
                    <button onclick="nextVocab()" class="text-xs text-slate-400 hover:text-white">Từ tiếp →</button>
                </div>
            </div>

            <!-- Quiz & Practice Section -->
            <div class="bg-slate-800/40 p-6 rounded-2xl border border-slate-700/50">
                <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center justify-between">
                    <span>Luyện Nghe & Chọn Đáp Án</span>
                    <span class="text-xs text-indigo-400" id="quizTypeTag">Nghe hiểu</span>
                </h3>
                
                <div class="mb-4">
                    <button onclick="tts.speak('你好，我是老师。')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold text-xs flex items-center space-x-2 transition shadow-lg shadow-emerald-600/20">
                        <span>▶ Phát Âm Thanh Bài Tập</span>
                    </button>
                </div>
                
                <div id="quizOptions" class="space-y-2.5">
                    <button onclick="checkAnswer(0)" class="w-full text-left p-3 rounded-xl bg-slate-700/40 hover:bg-indigo-600/30 border border-slate-600 hover:border-indigo-500 text-sm transition">A. Xin chào, tôi là bác sĩ.</button>
                    <button onclick="checkAnswer(1)" class="w-full text-left p-3 rounded-xl bg-slate-700/40 hover:bg-indigo-600/30 border border-slate-600 hover:border-indigo-500 text-sm transition">B. Xin chào, tôi là giáo viên.</button>
                    <button onclick="checkAnswer(2)" class="w-full text-left p-3 rounded-xl bg-slate-700/40 hover:bg-indigo-600/30 border border-slate-600 hover:border-indigo-500 text-sm transition">C. Tạm biệt bạn.</button>
                </div>

                <div id="quizFeedback" class="mt-4 p-3 rounded-xl text-xs hidden"></div>
            </div>

        </section>
    </main>

    <!-- JavaScript & JSON Data Engine -->
    <script>
        // 1. Text-To-Speech (Web Speech API)
        class ChineseTTS {
            constructor() {
                this.synth = window.speechSynthesis;
                this.speechRate = 0.9;
                this.lang = 'zh-CN';
            }
            setRate(rate) { this.speechRate = rate; }
            speak(text) {
                if (!this.synth) return alert("Trình duyệt không hỗ trợ TTS.");
                this.synth.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = this.lang;
                u.rate = this.speechRate;
                this.synth.speak(u);
            }
        }
        const tts = new ChineseTTS();

        // 2. Dữ liệu HSK & TOCFL (Cấu trúc JSON tách biệt)
        const database = {
            HSK: [
                {
                    lesson_id: "hsk1_01",
                    title: "Bài 1: 你好 (Xin chào)",
                    vocabulary: [
                        { simplified: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào", example: "你好！很高兴认识你。" },
                        { simplified: "老师", pinyin: "lǎoshī", meaning: "Giáo viên", example: "我是汉语老师。" }
                    ],
                    quiz: {
                        audio_text: "你好，我是老师。",
                        options: ["A. Xin chào, tôi là bác sĩ.", "B. Xin chào, tôi là giáo viên.", "C. Tạm biệt bạn."],
                        correctIndex: 1,
                        explanation: "老师 (lǎoshī) nghĩa là giáo viên."
                    }
                }
            ]
        };

        // 3. Application State & Controller
        let currentLesson = database.HSK[0];
        let vocabIndex = 0;
        let currentVocab = currentLesson.vocabulary[vocabIndex];
        let userXP = 0;
        let userStreak = 1;
        let isFlipped = false;

        function renderLesson() {
            currentVocab = currentLesson.vocabulary[vocabIndex];
            document.getElementById('cardZh').innerText = currentVocab.simplified;
            document.getElementById('cardPinyin').innerText = currentVocab.pinyin;
            document.getElementById('cardMeaning').innerText = currentVocab.meaning;
            document.getElementById('cardExample').innerText = `"${currentVocab.example}"`;
            document.getElementById('vocabProgress').innerText = `${vocabIndex + 1} / ${currentLesson.vocabulary.length}`;
            
            // Reset Flashcard View
            isFlipped = false;
            document.getElementById('cardFront').classList.remove('hidden');
            document.getElementById('cardBack').classList.add('hidden');
        }

        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                document.getElementById('cardFront').classList.add('hidden');
                document.getElementById('cardBack').classList.remove('hidden');
            } else {
                document.getElementById('cardFront').classList.remove('hidden');
                document.getElementById('cardBack').classList.add('hidden');
            }
            tts.speak(currentVocab.simplified);
        }

        function nextVocab() {
            if (vocabIndex < currentLesson.vocabulary.length - 1) {
                vocabIndex++;
                renderLesson();
            }
        }

        function prevVocab() {
            if (vocabIndex > 0) {
                vocabIndex--;
                renderLesson();
            }
        }

        function checkAnswer(index) {
            const feedback = document.getElementById('quizFeedback');
            feedback.classList.remove('hidden', 'bg-emerald-500/20', 'bg-rose-500/20', 'text-emerald-300', 'text-rose-300');
            
            if (index === currentLesson.quiz.correctIndex) {
                userXP += 20;
                document.getElementById('xpCount').innerText = `⚡ ${userXP}`;
                feedback.classList.add('bg-emerald-500/20', 'text-emerald-300');
                feedback.innerText = "🎉 Chính xác! +20 XP. " + currentLesson.quiz.explanation;
            } else {
                feedback.classList.add('bg-rose-500/20', 'text-rose-300');
                feedback.innerText = "❌ Chưa đúng! Lắng nghe lại phát âm và chọn lại nhé.";
            }
        }

        function loginGoogle() {
            alert("Tính năng Đăng nhập Google đã sẵn sàng kết nối OAuth 2.0!");
        }

        // Initialize App
        window.onload = () => {
            renderLesson();
        };
    </script>
</body>
</html>
